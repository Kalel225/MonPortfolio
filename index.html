  <script>
    /* Masquer au départ */
     const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('show');
        observer.unobserve(entry.target); // Pour n’animer qu’une fois
      }
    });
  });

  document.querySelectorAll('.hidden').forEach(el => observer.observe(el));

   function openModal(pageUrl) {
    const modal = document.getElementById('modal');
    const content = document.querySelector('.modal-content');
    const iframe = document.getElementById('modal-frame');

    modal.style.display = 'flex';
    content.classList.remove('hide'); // au cas où il y aurait une animation de fermeture précédente
    iframe.src = pageUrl;
  }

  function closeModal() {
    const modal = document.getElementById('modal');
    const content = document.querySelector('.modal-content');
    const iframe = document.getElementById('modal-frame');

    content.classList.add('hide');

    content.addEventListener('animationend', function handler() {
      modal.style.display = 'none';
      iframe.src = ''; // éviter que la page continue de tourner
      content.classList.remove('hide');
      content.removeEventListener('animationend', handler); // Nettoyage du listener
    });
  }
  const burger = document.getElementById('burger');
  const nav = document.getElementById('nav-menu');

  burger.addEventListener('click', () => {
    nav.classList.toggle('show');
    burger.classList.toggle('active');
  });
  </script>
